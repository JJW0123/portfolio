name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint HTML
        run: npx --yes htmlhint@1 "**/*.html"

      - name: Package site
        run: |
          mkdir -p dist
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude 'dist' \
            --exclude 'README.md' --exclude '.htmlhintrc' \
            ./ dist/

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to OCI
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_PORT: ${{ secrets.OCI_SSH_PORT || '22' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload files
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            dist/ "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:${{ secrets.OCI_DEPLOY_PATH }}/"

      - name: Health check
        if: ${{ vars.SITE_URL != '' }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ vars.SITE_URL }}")
            echo "HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 3
          done
          exit 1

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
